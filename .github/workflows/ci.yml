name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate catalogue and D1 migrations
        run: npm run validate

      - name: Validate operational scripts
        run: node --check scripts/prepare-admin-bootstrap.mjs

      - name: Generate Cloudflare types and build Astro Worker
        run: npm run build
