name: Enable D1 and Deploy

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type ENABLE_D1 to provision D1, apply migrations, and deploy
        required: true
        type: string

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-d1-production
  cancel-in-progress: false

jobs:
  migrate-and-deploy:
    if: ${{ inputs.confirmation == 'ENABLE_D1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build with D1 binding types
        run: npm run build:d1

      - name: Provision D1 and deploy fallback-safe Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.d1.jsonc

      - name: Apply pending D1 migrations
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply DB --remote --config wrangler.d1.jsonc

      - name: Deploy migrated D1 Worker
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: deploy --config wrangler.d1.jsonc

      - name: Show deployment URL
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: echo "D1-enabled deployment completed at ${DEPLOYMENT_URL}"
