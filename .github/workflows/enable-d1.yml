name: Enable D1 and Deploy

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type ENABLE_D1 to provision D1, apply migrations, and deploy
        required: true
        type: string

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-d1-production
  cancel-in-progress: false

jobs:
  migrate-and-deploy:
    if: ${{ inputs.confirmation == 'ENABLE_D1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Verify Cloudflare credentials
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID is not configured"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN is not configured"; exit 1; }

      - name: Install locked dependencies
        run: npm ci

      - name: Validate catalogue and D1 migrations
        run: npm run validate

      - name: Build with D1 binding types
        run: npm run build:d1

      - name: Provision D1 and deploy fallback-safe Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.d1.jsonc

      - name: Apply pending D1 migrations
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply DB --remote --config wrangler.d1.jsonc

      - name: Deploy migrated D1 Worker
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: deploy --config wrangler.d1.jsonc

      - name: Verify migrated D1 deployment
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          test -n "$DEPLOYMENT_URL" || { echo "Wrangler did not return a deployment URL"; exit 1; }
          HEALTH_JSON=$(curl --fail --silent --show-error --retry 5 --retry-delay 3 "$DEPLOYMENT_URL/api/health")
          echo "$HEALTH_JSON"
          HEALTH_JSON="$HEALTH_JSON" node --input-type=module -e '
            const health = JSON.parse(process.env.HEALTH_JSON ?? "{}");
            const failures = [];
            if (health.ok !== true) failures.push("health.ok is not true");
            if (health.dataMode !== "d1") failures.push(`unexpected dataMode: ${health.dataMode}`);
            if (health.bindings?.d1 !== true) failures.push("D1 binding is unavailable");
            if (health.bindings?.kv !== true) failures.push("KV binding is unavailable");
            if (health.bindings?.r2 !== true) failures.push("R2 binding is unavailable");
            if (health.bindings?.images !== true) failures.push("Images binding is unavailable");
            if (failures.length) {
              console.error(failures.join("\n"));
              process.exit(1);
            }
          '
          echo "D1-enabled deployment completed and verified: $DEPLOYMENT_URL"
